<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Keegan Fantasy Lottery
</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="app">


<header class="header">

<h1>
Keegan Fantasy Draft Lottery
</h1>

<p>
Weighted Elimination Lottery System
</p>

</header>



<main>


<section class="machine-section">


<h2>
Lottery Machine
</h2>


<div id="lotteryMachine">


<div id="machineStatus">

READY

</div>


</div>


</section>





<section class="dashboard">


<div class="panel">

<h3>
Elimination Chances
</h3>


<div id="oddsPanel">

Loading...

</div>


</div>




<div class="panel">

<h3>
Remaining Managers
</h3>


<div id="remainingPanel">

Loading...

</div>


</div>



</section>






<section class="panel">


<h3>
Elimination Results
</h3>


<div id="resultsPanel">

No lottery completed.

</div>


</section>






<section class="panel">


<h3>
Final Draft Order
</h3>


<div id="draftPanel">

Awaiting lottery.

</div>


</section>



</main>





<footer>


<button id="startButton">

Start Lottery

</button>



<button id="resetButton">

Reset

</button>



<button id="simulateButton">

Simulate

</button>



<button id="inspectButton">

Inspect Machine

</button>



</footer>



</div>




<script src="js/settings.js"></script>

<script src="js/lottery.js"></script>

<script src="js/ui.js"></script>

<script src="js/animation.js"></script>

<script src="js/simulator.js"></script>

<script src="js/app.js"></script>


</body>

</html>
